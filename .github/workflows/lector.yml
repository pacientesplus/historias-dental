name: El lector

# Solo a mano. Prueba todas las formas conocidas de leer comentarios.
# No publica ni modifica nada: solo lee.
on:
  workflow_dispatch:

jobs:
  lector:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install --quiet requests

      - name: Leer
        env:
          PYTHONUNBUFFERED: "1"
          IG_TOKEN_DENTALCIUDAD1: ${{ secrets.IG_TOKEN_DENTALCIUDAD1 }}
          FB_TOKEN_DENTALCIUDAD1: ${{ secrets.FB_TOKEN_DENTALCIUDAD1 }}
        run: python lector.py
